openapi: 3.1.0

info:
  title: 智慧树接口抓包汇总
  # 由 scripts/api_docs/build.py 从 pyproject.toml 注入，不要手改
  version: 0.0.0
  summary: ZHS 使用的智慧树平台 HTTP 接口
  description: |
    **更新时间**：2026-11-18

    本文档汇总 ZHS 用到的智慧树平台 HTTP 接口，内容来自实际抓包与代码实现。

    - **仅供学习与研究**，接口随时可能被服务端修改，以 `src/zhs/` 代码为准
    - 示例中的 Cookie、用户 ID 已脱敏
    - 每个接口标注抓包状态：`已确认` / `已观测` / `待复核` / `仅代码` / `仅文档`

    ### 域名

    接口分散在多个域名，各接口首部的「完整 URL」为准，常用域：

    | 代号 | 域名 |
    | --- | --- |
    | base | `onlineservice-api.zhihuishu.com` |
    | study | `studyservice-api.zhihuishu.com` |
    | homework | `studentexam-api.zhihuishu.com` |
    | taurusexam | `taurusexam-api.zhihuishu.com` |
    | exam | `studentexamtest.zhihuishu.com` |
    | ai | `kg-ai-run.zhihuishu.com` |
    | ai_task | `kg-run-student.zhihuishu.com` |
    | ai_analysis | `ai-course-assistant-api.zhihuishu.com` |
    | newbase | `newbase.zhihuishu.com` |
    | passport | `passport.zhihuishu.com` |

    ### 加密

    知到与 AI 智慧课程多数接口使用 AES-128-CBC，密文放在 `secretStr`，密钥按域区分：

    | 密钥名 | 值 | 使用范围 |
    | --- | --- | --- |
    | `video_key` | `azp53h0kft7qi78q` | 知到视频 |
    | `exam_key` | `onbfhdyvz8x7otrp` | 知到作业 / 考试 |
    | `ai_key` | `hw2fdlwcj4cs1mx7` | AI 智慧课程 |

    IV 统一为 `1g3qqdh4jvbskb9x`。每个接口的 Security 区块里也有同样的说明。
