components:
  securitySchemes:
    'AES-128-CBC (video_key)':
      type: apiKey
      in: query
      name: secretStr
      description: |
        **AES-128-CBC 加密**（密钥 `video_key`）

        | 项 | 值 |
        | --- | --- |
        | 密钥 | `azp53h0kft7qi78q` |
        | IV | `1g3qqdh4jvbskb9x` |
        | 密文字段 | `secretStr`（base64） |
        | 明文位置 | 本接口 Request 列出的业务参数 |

        请求时把业务参数序列化为 JSON 后加密，放入 `secretStr`，另需附带毫秒时间戳 `dateFormate`
        （GET 接口两者都在 query 上，POST 接口在 body 内）。

        页面上的 Request 是**解密后**的参数；**原始加密报文**见每个接口的「原始报文（加密后）」代码块。
    'AES-128-CBC (exam_key)':
      type: apiKey
      in: query
      name: secretStr
      description: |
        **AES-128-CBC 加密**（密钥 `exam_key`）

        | 项 | 值 |
        | --- | --- |
        | 密钥 | `onbfhdyvz8x7otrp` |
        | IV | `1g3qqdh4jvbskb9x` |
        | 密文字段 | `secretStr`（base64） |
        | 明文位置 | 本接口 Request 列出的业务参数 |

        请求时把业务参数序列化为 JSON 后加密，放入 `secretStr`。本域不发送 `dateFormate`。

        页面上的 Request 是**解密后**的参数；**原始加密报文**见每个接口的「原始报文（加密后）」代码块。
    'AES-128-CBC (ai_key)':
      type: apiKey
      in: query
      name: secretStr
      description: |
        **AES-128-CBC 加密**（密钥 `ai_key`）

        | 项 | 值 |
        | --- | --- |
        | 密钥 | `hw2fdlwcj4cs1mx7` |
        | IV | `1g3qqdh4jvbskb9x` |
        | 密文字段 | `secretStr`（base64） |
        | 时间戳字段 | `dateFormate`（本域部分接口用 `date`） |
        | 明文位置 | 本接口 Request 列出的业务参数 |

        页面上的 Request 是**解密后**的参数；**原始加密报文**见每个接口的「原始报文（加密后）」代码块。
    'AES-128-CBC (home_key)':
      type: apiKey
      in: query
      name: secretStr
      description: |
        **AES-128-CBC 加密**（密钥 `home_key`）

        | 项 | 值 |
        | --- | --- |
        | 密钥 | `7q9oko0vqb3la20r` |
        | IV | `1g3qqdh4jvbskb9x` |
        | 密文字段 | `secretStr`（base64） |
        | 明文位置 | 本接口 Request 列出的业务参数 |

        页面上的 Request 是**解密后**的参数；**原始加密报文**见每个接口的「原始报文（加密后）」代码块。

  schemas:
    QueryCourseResp:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: 0=成功，-1=参数错误，-12=需要验证码
        message:
          type: string
        data:
          type: object
          properties:
            recruitId:
              type: integer
              format: int64
            courseInfo:
              $ref: '#/components/schemas/CourseInfo'

    CourseInfo:
      type: object
      description: 课程基础信息（`courseMode` 是版本判定的唯一依据）
      properties:
        courseId:
          type: integer
          format: int64
        courseName:
          type: string
        courseMode:
          type: integer
          enum: [1, 2]
          description: 1=旧版课程，2=图谱课
        schoolName:
          type: string

    QuestionDto:
      type: object
      description: 知到作业 / 考试的题目
      properties:
        id:
          type: [integer, 'null']
          description: 数字型题目 ID（`doHomework` 下为 null，`lookHomework` 下才有值）
        eid:
          type: string
          description: 加密题目 ID，保存答案时必须回传
        questionType:
          type: integer
          enum: [1, 2, 14]
          description: 1=单选，2=多选，14=判断
        content:
          type: string
          description: 题干 HTML，使用前需剥离标签
        options:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
              content:
                type: string
