  - name: 知到-视频
    description: 课程信息、视频列表、进度上报、弹窗答题
  - name: 知到-作业
    description: 作业列表、作答、提交、查看
  - name: 知到-考试
    description: 考试列表、作答、提交
  - name: AI-智慧课程
    description: 知识点、课程信息、考试与作业、AI 解析（SSE）
  - name: Hike
    description: hike 域的课程与资源接口（字段待补，先占位）
  - name: 易盾验证码
    description: 网易易盾点选 / 滑块验证码（c.dun.163.com），纯 HTTP 取题与提交

