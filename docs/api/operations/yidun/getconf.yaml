tags: [易盾验证码]
summary: 获取验证码配置（dt / irToken）
operationId: yidunGetconf
description: |
  易盾三段式的第一步，下发 `dt`（数据令牌）与 `irToken`（行为令牌）。

  - `zoneId` 固定为空串，与 `get` / `check` 的 `zoneId=CN31` 不同
  - `iv` 固定 `5`（`get` / `check` 为 `4`）
  - 首次 `dt` 可为空，后续请求带上本次返回值
  - 不调用 `/v4/j/up` 上报行为时 `irToken` 通常为空，`get` 里留空也能取到题目
x-zhs-service: yidun
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-25
parameters:
  - name: referer
    in: query
    required: false
    description: |
      来源页地址（URL 编码）。浏览器 SDK 总会携带，但实测可省略：
      不传该参数或传空串时 `getconf` 仍返回 `error=0`。
      普通课程为 `https://studyvideoh5.zhihuishu.com/stuStudy`，
      智慧课程为 `https://wisdom-mooc.zhihuishu.com/study/index`。
    schema:
      type: string
      example: https://wisdom-mooc.zhihuishu.com/study/index
  - name: zoneId
    in: query
    required: true
    description: 固定为空串
    schema:
      type: string
      default: ''
  - name: dt
    in: query
    required: false
    description: 数据令牌，首次为空；之后复用本接口返回值
    schema:
      type: string
  - name: id
    in: query
    required: true
    description: 验证码 captchaId，题型由它决定
    schema:
      type: string
      enum:
        - 4da3050565514a35a50541b0e1f54538
        - 75f9f716460a422f89a628f50fd8cc2b
  - name: ipv6
    in: query
    required: false
    schema:
      type: string
      default: 'false'
  - name: runEnv
    in: query
    required: false
    schema:
      type: string
      default: '10'
  - name: iv
    in: query
    required: false
    description: 固定 `5`
    schema:
      type: string
      default: '5'
  - name: loadVersion
    in: query
    required: false
    description: SDK 加载器版本，与页面实际加载值一致
    schema:
      type: string
      default: '2.5.0'
  - name: lang
    in: query
    required: false
    schema:
      type: string
      default: zh-CN
  - name: callback
    in: query
    required: true
    description: JSONP 回调名，形如 `__JSONP_<7位随机字母数字>_<序号>`
    schema:
      type: string
responses:
  '200':
    description: |
      成功。响应体为 JSONP：`callback({...})`，需剥掉回调外壳再解析。
    content:
      application/javascript:
        schema:
          type: object
          properties:
            data:
              type: object
              properties:
                dt:
                  type: string
                  description: 数据令牌，后续 `get` / `check` 复用
                irToken:
                  type: string
                  description: 行为令牌，未上报行为时可空
            error:
              type: integer
              description: 0=成功
            msg:
              type: string
