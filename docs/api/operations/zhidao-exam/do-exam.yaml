tags: [知到-考试]
summary: 开始考试
operationId: doExam
description: |
  打开考试，返回题目列表（含加密 `eid`），响应结构与作业 `doHomework` 一致。
x-zhs-service: taurusexam
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-12
x-zhs-crypto:
  key: exam_key
  iv: 1g3qqdh4jvbskb9x
  cipherField: secretStr
  plaintextIn: json
  plainSchema:
    type: object
    required: [recruitId, examId, studentExamId, schoolId, courseId]
    properties:
      recruitId:
        type: string
        description: 招募 ID
      examId:
        type: string
        description: 考试 ID
      studentExamId:
        type: string
        description: 学生考试记录 ID
      schoolId:
        type: string
        description: 学校 ID（来自 `getLoginSchoolInfo`）
      courseId:
        type: string
        description: 课程 ID
      deviceId:
        type: string
        description: 设备 ID，通常为空字符串
  example:
    recruitId: '<recruitId>'
    examId: <examId>
    studentExamId: <studentExamId>
    schoolId: '<schoolId>'
    courseId: '<courseId>'
    deviceId: ''
  rawExample: |
    {
      "secretStr": "<AES加密后的base64密文>"
    }
responses:
  '200':
    description: 成功（`status == "200"`），题目在 `rt.examBase.workExamParts[].questionDtos[]`
