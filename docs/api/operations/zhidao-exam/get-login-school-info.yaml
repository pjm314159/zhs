tags: [知到-考试]
summary: 获取登录用户学校 ID
operationId: getLoginSchoolInfo
description: |
  按登录态返回用户所在学校信息，用于 `doExam` 与 `saveStudentAnswer` 的 `schoolId`。

  未绑定学校时 `rt` 或 `schoolId` 为 null，此时 `schoolId` 允许为空字符串。

  > 无业务参数，只加密一个 `{}`。
x-zhs-service: homework
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-12
x-zhs-crypto:
  key: exam_key
  iv: 1g3qqdh4jvbskb9x
  cipherField: secretStr
  plaintextIn: json
  plainSchema:
    type: object
    description: 无业务参数
  rawExample: |
    {
      "secretStr": "<AES加密后的base64密文>"
    }
responses:
  '200':
    description: 成功（`status == "200"`），`rt.schoolId` 为学校 ID
