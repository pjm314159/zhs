tags: [知到-视频]
summary: 获取学习令牌与续播信息
operationId: prelearningNote
description: |
  上报心跳前的必调接口，返回 `studiedLessonDto`：

  - `learnTimeSec` 是播放位置（续播起点）
  - `studyTotalTime` 是累计学习秒数，重看会持续增长，**可大于视频时长**
  - `id` 是心跳里的 `zwsds`（base64 后）

  > 把 `studyTotalTime` 当播放位置会导致"一次心跳越过结尾"。
x-zhs-service: study
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-18
x-zhs-crypto:
  key: video_key
  iv: 1g3qqdh4jvbskb9x
  cipherField: secretStr
  plaintextIn: json
  plainSchema:
    type: object
    required: [ccCourseId, chapterId, lessonId, lessonVideoId, recruitId, videoId]
    properties:
      ccCourseId:
        type: integer
        description: 课程 ID
      chapterId:
        type: integer
        description: 章节 ID
      isApply:
        type: integer
        description: 是否申请补看，抓包为 `1`
      lessonId:
        type: integer
        description: 课时 ID
      lessonVideoId:
        type: integer
        description: 课时视频 ID
      recruitId:
        type: integer
        description: 招募 ID
      videoId:
        type: integer
        description: 视频 ID（与 lessonVideoId 不同，以抓包为准）
      dateFormate:
        type: integer
        description: 毫秒时间戳
  example:
    ccCourseId: <courseId>
    chapterId: <chapterId>
    isApply: 1
    lessonId: <lessonId>
    lessonVideoId: <lessonVideoId>
    recruitId: <recruitId>
    videoId: <videoId>
    dateFormate: 1781740820451
  rawExample: |
    {
      "secretStr": "<AES加密后的base64密文>",
      "dateFormate": 1781740820451
    }
responses:
  '200':
    description: 成功（`code == 0`）
    content:
      application/json:
        schema:
          type: object
          properties:
            code:
              type: integer
            message:
              type: string
            data:
              type: object
              properties:
                isFace:
                  type: boolean
                  description: 是否需要人脸识别
                isSlide:
                  type: boolean
                  description: 是否需要滑动验证
                studiedLessonDto:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: 学习记录 ID（心跳的 `zwsds` 来源）
                    learnTime:
                      type: string
                      description: 已格式化的播放位置
                    learnTimeSec:
                      type: integer
                      description: 播放位置（秒），续播起点
                    studyTotalTime:
                      type: integer
                      description: 累计学习秒数，可能大于视频时长
                    watchState:
                      type: integer
                      description: 观看状态，抓包为 `2`
