tags: [知到-视频]
summary: 获取学习令牌与续播信息
operationId: prelearningNote
description: |
  上报心跳前的必调接口，返回 `studiedLessonDto`：

  - `learnTimeSec` 是播放位置（续播起点）
  - `studyTotalTime` 是累计学习秒数，重看会持续增长，**可大于视频时长**

  > 把 `studyTotalTime` 当播放位置会导致"一次心跳越过结尾"。
x-zhs-service: study
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-12
x-zhs-crypto:
  key: video_key
  iv: 1g3qqdh4jvbskb9x
  cipherField: secretStr
  plaintextIn: json
  plainSchema:
    type: object
    required: [ccCourseId, chapterId, lessonId, lessonVideoId, recruitId, videoId]
    properties:
      ccCourseId:
        type: integer
        description: 课程 ID
      chapterId:
        type: integer
        description: 章节 ID
      lessonId:
        type: integer
        description: 课时 ID
      lessonVideoId:
        type: integer
        description: 视频 ID
      recruitId:
        type: integer
        description: 招募 ID
      videoId:
        type: integer
        description: 视频 ID（与 lessonVideoId 相同，待复核）
      isApply:
        type: integer
        description: 是否为申请补看（待复核）
  rawExample: |
    {
      "secretStr": "<AES加密后的base64密文>",
      "dateFormate": 1781740820451
    }
responses:
  '200':
    description: 含 `studiedLessonDto.{id, learnTimeSec, studyTotalTime}`（字段待补）
