tags: [知到-视频]
summary: 上报视频进度（Cache 心跳）
operationId: saveCacheIntervalTimeV2
description: |
  Cache 心跳，约 180 秒一次（与 Database 心跳各自计时，但共用一条增量链）。

  - `ewssw` 是观看轨迹点，逗号分隔的字符串；上报后重置为 `[0,1]`，再从当前位置续写
  - `sdsew` 是本段增量参数（加密数组，字段顺序见 `sdsew` 字段说明），服务端按其中的本段秒累加学习时长
  - `zwsds` 是 `prelearningNote` 返回的 `id` 做 base64

  > 两种心跳各自计算增量会重复累加，下次上报会返回 `-8 学习总时长下降了`。
x-zhs-service: study
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-12
x-zhs-crypto:
  key: video_key
  iv: 1g3qqdh4jvbskb9x
  cipherField: secretStr
  plaintextIn: json
  plainSchema:
    type: object
    required: [ewssw, sdsew, zwsds]
    properties:
      ewssw:
        type: string
        description: 观看轨迹点，逗号分隔（如 "0,1,44,45"）；上报后重置为 [0,1]，再从当前位置续写
      sdsew:
        type: string
        description: '加密后的数组，解密后按 ";" 分隔，顺序与 Database 心跳不同：recruitId;chapterId;courseId;lessonId;HH:MM:SS;累计秒;videoId;lessonVideoId;本段秒;uuid+"zhs"；其中 courseId 与 Database 一致（取 courseInfo.courseId），时间字段统一 HH:MM:SS（补前导零）'
      zwsds:
        type: string
        description: base64 后的学习令牌
  rawExample: |
    {
      "secretStr": "<AES加密后的base64密文>",
      "dateFormate": 1781740820451
    }
responses:
  '200':
    description: 成功；`-8` 表示学习总时长下降（字段待补）
