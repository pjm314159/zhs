tags: [AI-智慧课程]
summary: 获取课程知识点
operationId: courseBasic
description: |
  获取 AI 课程的章节 / 知识点树，返回 `AiCourseInfo`。
x-zhs-service: ai
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-12
x-zhs-crypto:
  key: ai_key
  iv: 1g3qqdh4jvbskb9x
  cipherField: secretStr
  plaintextIn: json
  plainSchema:
    type: object
    required: [courseId, classId]
    properties:
      courseId:
        type: integer
        description: 课程 ID
      classId:
        type: integer
        description: 班级 ID
  example:
    courseId: <courseId>
    classId: <classId>
  rawExample: |
    {
      "secretStr": "<AES加密后的base64密文>",
      "dateFormate": 1781740820451
    }
responses:
  '200':
    description: 成功（`code == 200`），数据结构见 `AiCourseInfo`
