tags: [知到-作业]
summary: 获取学生答案信息
operationId: getStuAnswerInfo
description: |
  查看已提交作业时，按题目数字型 `id` 获取对错信息。

  > `questionIds` 是逗号分隔的字符串，不是数组。
x-zhs-service: homework
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-12
x-zhs-crypto:
  key: exam_key
  iv: 1g3qqdh4jvbskb9x
  cipherField: secretStr
  plaintextIn: json
  plainSchema:
    type: object
    required: [recruitId, stuExamId, examId, schoolId, courseId, questionIds]
    properties:
      recruitId:
        type: string
        description: 招募 ID
      stuExamId:
        type: string
        description: 学生作业 ID
      examId:
        type: string
        description: 作业 ID
      schoolId:
        type: string
        description: 学校 ID
      courseId:
        type: string
        description: 课程 ID
      questionIds:
        type: string
        description: 逗号分隔的题目 ID，如 `"<questionId1>,<questionId2>"`
  example:
    recruitId: '<recruitId>'
    stuExamId: <studentExamId>
    examId: <examId>
    schoolId: '<schoolId>'
    courseId: '<courseId>'
    questionIds: '<questionId1>,<questionId2>'
  rawExample: |
    {
      "secretStr": "<AES加密后的base64密文>"
    }
responses:
  '200':
    description: 成功（`status == "200"`），`rt` 里按题目 ID 返回作答与对错
