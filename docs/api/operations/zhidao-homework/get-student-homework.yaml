tags: [知到-作业]
summary: 获取作业列表
operationId: getStudentHomework
description: |
  分页获取作业列表，`flag=1` 未提交、`flag=2` 已提交。作业作答流程的第一步。
x-zhs-service: homework
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-12
x-zhs-crypto:
  key: exam_key
  iv: 1g3qqdh4jvbskb9x
  cipherField: secretStr
  plaintextIn: json
  plainSchema:
    type: object
    required: [recruitId, courseId, flag, pageSize, pageNum]
    properties:
      recruitId:
        type: string
        description: 招募 ID
      courseId:
        type: integer
        description: 课程 ID
      flag:
        type: integer
        enum: [1, 2]
        description: 1=未提交，2=已提交
      pageSize:
        type: integer
        description: 每页数量，代码用 100
      pageNum:
        type: integer
        description: 页码，从 0 开始
  example:
    recruitId: '<recruitId>'
    courseId: <courseId>
    flag: 1
    pageSize: 100
    pageNum: 0
  rawExample: |
    {
      "secretStr": "<AES加密后的base64密文>"
    }
responses:
  '200':
    description: 成功（`status == "200"`）
    content:
      application/json:
        schema:
          type: object
          properties:
            currentTime:
              type: integer
            msg:
              type: string
            status:
              type: string
              description: '"200" 表示成功'
            rt:
              type: object
              properties:
                next:
                  type: integer
                  description: 下一页页码，-1 表示没有更多
                studentHomeworkList:
                  type: array
                  items:
                    type: object
                    properties:
                      examId:
                        type: string
                        description: 作业 ID
                      id:
                        type: string
                        description: 学生作业 ID（`studentExamId`）
                      examName:
                        type: string
                      state:
                        type: integer
                        description: 1=未提交，4=已提交
                      isMarking:
                        type: integer
                        description: 已重做次数
