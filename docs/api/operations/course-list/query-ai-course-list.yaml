tags: [课程列表]
summary: 获取 AI 智慧课程列表
operationId: queryStudentAICourseList
description: |
  返回当前账号下的 AI 智慧课程，元素含 `courseId` / `classId`，用于 `zhs play --type ai`。

  > 本接口用 `home_key` 加密，成功判定是 `code == 0`。
x-zhs-service: base
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-12
x-zhs-crypto:
  key: home_key
  iv: 1g3qqdh4jvbskb9x
  cipherField: secretStr
  plaintextIn: json
  plainSchema:
    type: object
    required: [status]
    properties:
      status:
        type: integer
        description: 固定 `3`
  example:
    status: 3
  rawExample: |
    {
      "secretStr": "<AES加密后的base64密文>",
      "dateFormate": 1781740820451
    }
responses:
  '200':
    description: 成功（`code == 0`），课程数组在 `rt`
    content:
      application/json:
        schema:
          type: object
          properties:
            code:
              type: integer
            rt:
              type: array
              items:
                type: object
                properties:
                  courseId:
                    type: string
                    description: 课程 ID
                  classId:
                    type: integer
                    description: 班级 ID
                  courseName:
                    type: string
