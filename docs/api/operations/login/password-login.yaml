tags: [登录]
summary: 账户密码登录（提交账号密码）
operationId: loginByAccount
description: |
  密码登录第一步：提交加密后的 `{account, password, validate}`。

  `validate` 为登录页易盾滑块的校验值（与视频滑块同协议）；前端在 `validate` 为空时
  不会发起本请求，因此调用方必须先通过验证码。

  **响应 `status` 分支**：

  | status | 含义 | 后续 |
  | --- | --- | --- |
  | `1` | 成功 | 取 `rt.pwd` 跳 `passport/login?pwd=`；有 `rt.uuid` 时先调 `skipSet/{uuid}` |
  | `2` | 正常分支（仅未完成学校认证） | 取 `rt.cacheId` 调 `skipSet/{cacheId}` 续登，成功后登录完成，全部功能可用 |
  | `-12` | 需要二次验证码 | 本期不实现 |
  | `-5` | 密码过于简单 | 提示重置 |
  | `-13` | 异常登录 | 本期不实现 |
  | `ACCOUNT_DISABLED` | 账号被禁用 | 提示 |

  `status=2` 仅表示未完成学校认证，不是失败分支：续登成功后登录态与 `status=1` 等价，
  看课、作业、考试等全部功能均可正常使用。

  与其它加密接口同样使用 AES-128-CBC + Base64、同样复用 `Cipher`，
  但**封装不同**：整个 body 就是密文字符串（带双引号），没有 `secretStr` 包装，
  也不发送 `dateFormate`，且 IV 为该接口专用。
x-zhs-service: user
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-25
x-zhs-crypto:
  key: login_key
  iv: 563216db1e1744c7
  cipherField: <裸字符串，body 本身>
  plaintextIn: json
  plainSchema:
    type: object
    required: [account, password, validate]
    properties:
      account:
        type: string
        description: 账号（手机号）
      password:
        type: string
        description: 明文密码
      validate:
        type: string
        description: 易盾滑块校验值
  example:
    account: '<account>'
    password: '<password>'
    validate: <validate>
  rawExample: |
    "ZHVtbXktY2lwaGVydGV4dC1mb3ItZG9jcy1vbmx5"
parameters:
  - name: Origin
    in: header
    required: true
    description: 固定为 `https://login.zhihuishu.com`
    schema:
      type: string
      default: https://login.zhihuishu.com
  - name: Referer
    in: header
    required: true
    description: 固定为 `https://login.zhihuishu.com/`
    schema:
      type: string
      default: https://login.zhihuishu.com/
responses:
  '200':
    description: 登录结果
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: [integer, string]
              description: 1=成功；2=需要续登；-12/-5/-13 为失败分支；也可能是 `ACCOUNT_DISABLED`
            msg:
              type: string
            isSkipPolymas:
              type: boolean
            rt:
              type: object
              description: 成功或需要续登时返回
              properties:
                pwd:
                  type: string
                  description: 一次性密码（oncePassword），用于 passport 换票
                uuid:
                  type: string
                  description: 用户标识
                cacheId:
                  type: string
                  description: status=2 时用于 `skipSet` 续登
                bindUserId:
                  type: string
                mobile:
                  type: string
                realname:
                  type: string
