tags: [AI-智慧课程]
summary: 考试用时心跳
operationId: updateUserUsedTime
description: |
  考试过程中的心跳，固定间隔上报，防止服务端判定超时。

  > 考试与作业共用本接口，作业侧一般不需要。
x-zhs-service: exam
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-12
x-zhs-crypto:
  key: exam_key
  iv: 1g3qqdh4jvbskb9x
  cipherField: secretStr
  plaintextIn: json
  plainSchema:
    type: object
    required: [examTestId, examPaperId, heartbeatTime]
    properties:
      examTestId:
        type: integer
      examPaperId:
        type: integer
      heartbeatTime:
        type: integer
        description: 心跳秒数，代码固定 5
  example:
    examTestId: <examTestId>
    examPaperId: <examPaperId>
    heartbeatTime: 5
  rawExample: |
    {
      "secretStr": "<AES加密后的base64密文>",
      "dateFormate": 1781740820451
    }
responses:
  '200':
    description: 成功（`code == 0`）
