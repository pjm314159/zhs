tags: [AI-智慧课程]
summary: 获取题目详情
operationId: getExamQuestionInfo
description: |
  获取单题题干与选项（考试 / 作业共用），`data` 结构见 `QuestionContent`。

  > 同一题目可带不同 `version` 重复拉取，代码失败时会重试 3 次。
x-zhs-service: exam
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-12
x-zhs-crypto:
  key: exam_key
  iv: 1g3qqdh4jvbskb9x
  cipherField: secretStr
  plaintextIn: json
  plainSchema:
    type: object
    required: [examTestId, examPaperId, questionId, version]
    properties:
      examTestId:
        type: integer
        description: 考试 / 作业 ID
      examPaperId:
        type: integer
        description: 试卷 ID
      questionId:
        type: integer
        description: 题目 ID
      version:
        type: integer
        description: 题目版本号（来自答题卡）
  example:
    examTestId: <examTestId>
    examPaperId: <examPaperId>
    questionId: <questionId>
    version: 1
  rawExample: |
    {
      "secretStr": "<AES加密后的base64密文>",
      "dateFormate": 1781740820451
    }
responses:
  '200':
    description: 成功（`code == 0`），`data` 为题目的题干与选项
