tags: [AI-智慧课程]
summary: 打开考试 / 作业
operationId: openExam
description: |
  **考试**：`{examTestId, courseId}`，开考前需先调 `start-pull-paper`。
  **作业**：额外带 `examPaperId`（`{examTestId, examPaperId, courseId}`）。

  两种场景同一路径、同一密钥，按 `examTestId` 是否为作业区分。
x-zhs-service: exam
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-12
x-zhs-crypto:
  key: exam_key
  iv: 1g3qqdh4jvbskb9x
  cipherField: secretStr
  plaintextIn: json
  plainSchema:
    type: object
    required: [examTestId, courseId]
    properties:
      examTestId:
        type: integer
        description: 考试 / 作业 ID
      courseId:
        type: string
        description: 课程 ID
      examPaperId:
        type: integer
        description: 试卷 ID（作业场景必填）
  example:
    examTestId: <examTestId>
    courseId: '<courseId>'
  rawExample: |
    {
      "secretStr": "<AES加密后的base64密文>",
      "dateFormate": 1781740820451
    }
responses:
  '200':
    description: 成功（`code == 0`）
