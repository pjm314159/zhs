tags: [AI-智慧课程]
summary: 获取答题卡信息（考试）
operationId: getAnswerSheetInformation
description: |
  返回考试的答题卡（`data.partSheetVos[].questionSheetVos[]`），ZHS 用它取出题目 ID 列表。
x-zhs-service: exam
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-12
x-zhs-crypto:
  key: exam_key
  iv: 1g3qqdh4jvbskb9x
  cipherField: secretStr
  plaintextIn: json
  plainSchema:
    type: object
    required: [examTestId, examPaperId]
    properties:
      examTestId:
        type: integer
        description: 考试 ID
      examPaperId:
        type: integer
        description: 试卷 ID
  example:
    examTestId: <examTestId>
    examPaperId: <examPaperId>
  rawExample: |
    {
      "secretStr": "<AES加密后的base64密文>",
      "dateFormate": 1781740820451
    }
responses:
  '200':
    description: 成功（`code == 0`），题目在 `data.partSheetVos[].questionSheetVos[]`
