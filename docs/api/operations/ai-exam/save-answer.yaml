tags: [AI-智慧课程]
summary: 保存单题答案（作业）
operationId: saveAnswer
description: |
  作业逐题保存答案，`answer` 为选项 ID，多个用 `#@#` 拼接。
x-zhs-service: exam
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-12
x-zhs-crypto:
  key: exam_key
  iv: 1g3qqdh4jvbskb9x
  cipherField: secretStr
  plaintextIn: json
  plainSchema:
    type: object
    required: [recruitId, examTestId, examPaperId, questionId, answer]
    properties:
      recruitId:
        type: string
        description: 招募 ID（代码里实际传课程 ID）
      examTestId:
        type: integer
      examPaperId:
        type: integer
      questionId:
        type: integer
      dataVos:
        type: object
        nullable: true
        description: 固定 null
      answer:
        type: string
        description: 选项 ID，多个用 `#@#` 分隔
  example:
    recruitId: '<courseId>'
    examTestId: <examTestId>
    examPaperId: <examPaperId>
    questionId: <questionId>
    dataVos: null
    answer: '<optionId>'
  rawExample: |
    {
      "secretStr": "<AES加密后的base64密文>",
      "dateFormate": 1781740820451
    }
responses:
  '200':
    description: 成功（`code == 0`）
