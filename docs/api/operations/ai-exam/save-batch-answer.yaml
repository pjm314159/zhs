tags: [AI-智慧课程]
summary: 批量保存答案（考试）
operationId: saveBatchAnswer
description: |
  考试按批保存答案，`answerList` 每个元素是一道题。多选答案用 `#@#` 拼接选项 ID。
x-zhs-service: exam
x-zhs-status: confirmed
x-zhs-evidence:
  capturedAt: 2026-11-12
x-zhs-crypto:
  key: exam_key
  iv: 1g3qqdh4jvbskb9x
  cipherField: secretStr
  plaintextIn: json
  plainSchema:
    type: object
    required: [examTestId, examPaperId, recruitId, answerList]
    properties:
      examTestId:
        type: integer
      examPaperId:
        type: integer
      recruitId:
        type: string
        description: 招募 ID（代码里实际传课程 ID）
      answerList:
        type: array
        items:
          type: object
          properties:
            recruitId:
              type: string
            examTestId:
              type: integer
            examPaperId:
              type: integer
            questionId:
              type: integer
            answer:
              type: string
              description: 选项 ID，多个用 `#@#` 分隔
            questionType:
              type: integer
            dataVos:
              type: [object, 'null']
  example:
    examTestId: <examTestId>
    examPaperId: <examPaperId>
    recruitId: '<courseId>'
    answerList:
      - recruitId: '<courseId>'
        examTestId: <examTestId>
        examPaperId: <examPaperId>
        questionId: <questionId>
        answer: '<optionId>'
        questionType: 1
        dataVos: null
  rawExample: |
    {
      "secretStr": "<AES加密后的base64密文>",
      "dateFormate": 1781740820451
    }
responses:
  '200':
    description: 成功（`code == 0`）
