name: Prepare Release

# 发布准备（方案 B：CHANGELOG 在「发布前」生成）
#
# 手动触发 → 自动完成：
#   1. 校验版本号格式与标签占用
#   2. 更新 pyproject.toml 的 version
#   3. 用 git-cliff 生成新版本段落并写入 CHANGELOG.md
#   4. 推送 chore/release-vX.Y.Z 分支并开 PR 到 main
#
# 合并该 PR 后，在 main 上打 tag 即触发 release.yml（build + GitHub Release + PyPI）。
# 发布后不再有任何回写提交，main 与 dev 不会再分叉。
on:
  workflow_dispatch:
    inputs:
      version:
        description: "发布版本号（不含 v 前缀，如 0.1.5）"
        required: true
        type: string

concurrency:
  group: prepare-release
  cancel-in-progress: false

permissions:
  contents: write       # 推送发布分支
  pull-requests: write  # 创建发布 PR（需仓库允许 Actions 创建 PR，见 docs/linter.md §9.3）

jobs:
  prepare:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev       # 发布准备永远基于 dev
          fetch-depth: 0  # git-cliff 需要完整历史

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::版本号格式应为 X.Y.Z（不含 v 前缀），收到：$VERSION"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::标签 v$VERSION 已存在，请换一个版本号"
            exit 1
          fi

      - name: Bump version in pyproject.toml
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -i -E "s|^version = \"[^\"]+\"$|version = \"$VERSION\"|" pyproject.toml
          grep -E '^version = ' pyproject.toml

      - name: Generate new changelog section (git-cliff)
        uses: orhun/git-cliff-action@v4
        env:
          OUTPUT: release-notes.md
        with:
          config: cliff.toml
          # 标签此时尚未创建，--unreleased 才会把「上次标签之后的提交」归入新版本
          args: --unreleased --tag v${{ inputs.version }} --strip header

      - name: Insert new section into CHANGELOG.md
        run: |
          python3 - <<'PY'
          import pathlib

          FOOTER = "<!-- generated by git-cliff -->"
          section = pathlib.Path("release-notes.md").read_text(encoding="utf-8")
          # 段落插入 CHANGELOG 正文，不重复 footer 注释
          section = "\n".join(line for line in section.splitlines() if line.strip() != FOOTER).strip()
          if not section:
              raise SystemExit("git-cliff 未生成任何内容，请检查 cliff.toml")

          changelog = pathlib.Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          index = text.find("\n## [")
          if index == -1:
              raise SystemExit("CHANGELOG.md 中未找到版本段落（\\n## [）")
          changelog.write_text(f"{text[:index]}\n\n{section}\n{text[index:]}", encoding="utf-8")
          print("CHANGELOG.md 已插入新版本段落")
          PY

      - name: Commit, push branch and open PR to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          REPO: ${{ github.repository }}
        run: |
          BRANCH="chore/release-v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pyproject.toml CHANGELOG.md
          git commit -m "chore(release): prepare v$VERSION"
          git push origin "HEAD:$BRANCH"

          {
            echo "## 发布准备 v$VERSION"
            echo
            echo "- \`pyproject.toml\` version → \`$VERSION\`"
            echo "- \`CHANGELOG.md\` 已追加 v$VERSION 段落（git-cliff 生成，可在此 PR 中审阅）"
            echo
            echo "**合并本 PR 后**，请在 \`main\` 上打 tag 触发 \`release.yml\`（check → build → GitHub Release → PyPI）："
            echo
            echo '```bash'
            echo "git checkout main && git pull"
            echo "git tag v$VERSION && git push origin v$VERSION"
            echo '```'
            echo
            cat release-notes.md
          } > pr-body.md

          if gh pr create --base main --head "$BRANCH" \
              --title "release: v$VERSION" \
              --body-file pr-body.md; then
            echo "✅ 发布 PR 已创建"
          else
            echo "::warning::无法自动创建 PR（仓库未允许 GitHub Actions 创建 PR）。分支 $BRANCH 已推送，请手动打开：https://github.com/$REPO/compare/main...$BRANCH?expand=1"
          fi
