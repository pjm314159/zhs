name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write  # PyPI Trusted Publishing (OIDC)

jobs:
  # ── Pre-release Checks ─────────────────────────────────────────
  check:
    name: Pre-release Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff lint (src + tests)
        run: uv run ruff check src/ tests/

      - name: Ruff format check (src + tests)
        run: uv run ruff format --check src/ tests/

      - name: Mypy (src + tests)
        run: uv run mypy src/ tests/

      - name: Full test suite
        run: uv run pytest --tb=short -q

  # ── Build & Publish ────────────────────────────────────────────
  build:
    name: Build & Publish
    runs-on: ubuntu-latest
    needs: check
    environment: pypi  # 需在 GitHub 仓库 Settings > Environments 中创建 pypi 环境
    permissions:
      contents: write
      id-token: write  # OIDC 签名
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git-cliff 需要完整历史

      - uses: astral-sh/setup-uv@v4

      - name: Generate changelog (full, for CHANGELOG.md)
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: --tag ${{ github.ref_name }}
        env:
          OUTPUT: CHANGELOG.md

      - name: Generate release notes (latest tag only)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --tag ${{ github.ref_name }} --strip header
        env:
          OUTPUT: release-notes.md

      - name: Build package
        run: uv build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        run: uv publish

      # 注意：此处不重新生成 / 回写 CHANGELOG.md。
      # 方案 B 在「发布前」由 prepare-release.yml 生成 CHANGELOG 并随发布 PR 合入 main。
      #
      # 但发布提交（版本号 + CHANGELOG 段落）只落在 main，需要带回 dev：
      # 否则下一次 Prepare Release（从 dev 取文件）会缺少本次 CHANGELOG 段落。
      # 使用纯快进推送：dev 若已有新提交会失败（不会覆盖），且失败不影响发布结果。
      - name: Sync dev with main (fast-forward, best effort)
        continue-on-error: true
        run: |
          git fetch origin main dev
          git push origin origin/main:dev
