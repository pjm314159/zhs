name: 功能建议
description: 提出新功能或改进建议
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        感谢建议！提交前请先搜索现有 Issue，确认没有重复。

  - type: textarea
    id: problem
    attributes:
      label: 需求背景
      description: 描述当前遇到的痛点或使用场景，说明为什么需要这个功能
      placeholder: 我在 ... 场景下遇到 ...，希望可以 ...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: 期望方案
      description: 描述你期望的功能形态（如 CLI 用法、配置项、行为变化）
      placeholder: |
        zhs play --new-option xxx
        # 或在 config.toml 中新增 ...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他实现方式，或目前使用的临时替代手段
    validations:
      required: false

  - type: checkboxes
    id: scope
    attributes:
      label: 影响范围（可多选）
      options:
        - label: CLI（`zhs play` / `homework` / `exam` / `fetch`）
        - label: 配置（`config.toml`）
        - label: 文档（README / docs）
        - label: 其他

  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索过现有 Issue，确认没有重复
          required: true
        - label: 我已阅读 `docs/linter.md`，了解项目代码规范
          required: true
